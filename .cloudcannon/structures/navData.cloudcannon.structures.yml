navData:
  style: modal
  values:
    - label: Navigation Item
      icon: link
      description: A navigation item with name, path, and optional children.
      value:
        name: ""
        path: ""
        children: []
      preview:
        text:
          - key: name
          - Navigation Item
        subtext:
          - key: path
          - Add path
      picker_preview:
        text: Navigation Item
        subtext: A navigation item with name, path, and optional children.
        icon: link
      _inputs:
        name:
          type: text
          comment: Display text for the navigation item.
        path:
          type: text
          comment: URL path for the navigation item.
        children:
          type: array
          label: Child Navigation Items
          comment: Child navigation items for dropdown menus.
          options:
            structures:
              - label: Navigation Item
                icon: link
                value:
                  name: ""
                  path: ""
                  subtext: ""
                  iconName: ""
                  iconPosition: before
                  children: []
                preview:
                  text:
                    - key: name
                    - Navigation Item
                  subtext:
                    - key: subtext
                    - key: path
                    - Add path
                  icon:
                    - key: iconName
                    - link
                _inputs:
                  name:
                    type: text
                    comment: Display text for the child navigation item.
                  path:
                    type: text
                    comment: URL path for the child navigation item.
                  subtext:
                    type: text
                    comment: Optional description shown beneath the name in the dropdown.
                  iconName:
                    type: select
                    comment: Optional icon shown alongside the name. Sourced from [Heroicons](https://heroicons.com/).
                    options:
                      values: _select_data.icons
                      preview:
                        text:
                          - key: name
                        image:
                          - template: src/icons/{id}.svg
                  iconPosition:
                    type: select
                    comment: Whether the icon sits before or after the name.
                    hidden: "!iconName"
                    options:
                      values:
                        - id: before
                          name: Before
                        - id: after
                          name: After
                  children:
                    type: array
                    label: Grandchild Navigation Items
                    comment: Grandchild navigation items for nested dropdowns.
                    options:
                      structures:
                        - label: Navigation Item
                          icon: link
                          value:
                            name: ""
                            path: ""
                            subtext: ""
                            iconName: ""
                            iconPosition: before
                          preview:
                            text:
                              - key: name
                              - Navigation Item
                            subtext:
                              - key: subtext
                              - key: path
                              - Add path
                            icon:
                              - key: iconName
                              - link
                          _inputs:
                            name:
                              type: text
                              comment: Display text for the grandchild navigation item.
                            path:
                              type: text
                              comment: URL path for the grandchild navigation item.
                            subtext:
                              type: text
                              comment: Optional description shown beneath the name in the dropdown.
                            iconName:
                              type: select
                              comment: Optional icon shown alongside the name. Sourced from [Heroicons](https://heroicons.com/).
                              options:
                                values: _select_data.icons
                                preview:
                                  text:
                                    - key: name
                                  image:
                                    - template: src/icons/{id}.svg
                            iconPosition:
                              type: select
                              comment: Whether the icon sits before or after the name.
                              hidden: "!iconName"
                              options:
                                values:
                                  - id: before
                                    name: Before
                                  - id: after
                                    name: After
