background:
  style: select
  comment: Optional background still image or looping HTML5 video (self-hosted).
  values:
    - label: Background
      icon: wallpaper
      value:
        type: image
        positionVertical: top
        positionHorizontal: center
        priority: false
        imageSource: ""
        imageAlt: ""
        videoSource: null
        overlay: 0
      _inputs:
        type:
          type: select
          label: Background type
          comment: A cover image or a muted autoplay video.
          options:
            values:
              - id: image
                name: Image
              - id: video
                name: Video
        positionVertical:
          comment: Vertical focal point (object-position for video; image position for pictures).
          type: select
          options:
            values:
              - id: top
                name: Top
              - id: center
                name: Center
              - id: bottom
                name: Bottom
        positionHorizontal:
          comment: Horizontal focal point (object-position for video; image position for pictures).
          type: select
          options:
            values:
              - id: left
                name: Left
              - id: center
                name: Center
              - id: right
                name: Right
        priority:
          type: switch
          label: Prioritize image load
          comment: When using a background image, load it eagerly (use for above-the-fold sections).
          hidden: "type !== 'image'"
        imageSource:
          comment: URL or path to the background image.
          type: image
          hidden: "type !== 'image'"
          options:
            paths:
              uploads: src/assets/images
              static: ""
            resize_style: contain
            width: 1920
            height: 1280
        imageAlt:
          comment: Alt text for the background image.
          type: textarea
          hidden: "type !== 'image'"
        videoSource:
          type: file
          label: Video source
          comment: Path to a video under public/videos. Sibling formats with the same basename are added automatically when present.
          hidden: "type !== 'video'"
          options:
            accepts_mime_types:
              - video/mp4
              - video/webm
              - video/ogg
            paths:
              uploads: public/videos
              static: public
        overlay:
          type: range
          comment: "Overlay in front of the background (-1.0 to 1.0). Negative values darken, positive values lighten."
          options:
            min: -1
            max: 1
            step: 0.1
