featureSlider:
  template: mdx_component
  inline: false
  preview:
    text:
      - Feature Slider
    icon: view_carousel
    gallery:
      image: public/component-previews/page-sections/features/feature-slider.svg
      fit: cover
  definitions:
    component_name: FeatureSlider
    named_args:
      - editor_key: sectionLabel
        type: string
        optional: true
        remove_empty: true
      - editor_key: maxContentWidth
        type: string
        optional: true
        remove_empty: true
      - editor_key: paddingHorizontal
        type: string
        optional: true
        remove_empty: true
      - editor_key: paddingVertical
        type: string
        optional: true
        remove_empty: true
      - editor_key: slides
        type: array
      - editor_key: eyebrowIcon
        type: object
        optional: true
      - editor_key: eyebrowText
        type: string
        optional: true
        remove_empty: true
      - editor_key: heading
        type: string
        optional: true
        remove_empty: true
      - editor_key: subtext
        type: string
        optional: true
        remove_empty: true
      - editor_key: colorScheme
        type: string
        optional: true
        remove_empty: true
      - editor_key: backgroundColor
        type: string
        optional: true
        remove_empty: true
      - editor_key: contentBackground
        type: boolean
        optional: true
      - editor_key: background
        type: object
        optional: true
        remove_empty: true
      - editor_key: verticalOffset
        type: object
        optional: true
      - editor_key: rounded
        type: boolean
        optional: true
  _inputs_from_glob:
    - /src/components/page-sections/features/feature-slider/feature-slider.cloudcannon.inputs.yml
