slides:
  type: array
  label: Slides
  comment: Structured feature slides rendered inside the carousel.
  options:
    structures:
      - label: Feature slide
        icon: view_carousel
        value:
          _component: page-sections/features/feature-slider/feature-slider-item
          eyebrow: ""
          title: Slide title
          description: Short description for this slide.
          imageSource: /src/assets/images/component-docs/website-feature.svg
          imageAlt: Slide image alt text
        preview:
          text:
            - key: title
            - Feature slide
          subtext:
            - key: description
            - Add description for this slide
        _inputs:
          eyebrow:
            type: text
            comment: Optional eyebrow text displayed above the title.
          title:
            type: text
            comment: Heading text shown on the slide.
          description:
            type: markdown
            comment: Supporting body copy shown on the slide.
          imageSource:
            type: image
            comment: Image shown on the side of the slide.
            options:
              paths:
                uploads: src/assets/images
                static: ""
              resize_style: contain
              width: 1920
              height: 1280
          imageAlt:
            type: text
            comment: Alt text describing the slide image.
sectionLabel:
  type: text
  comment: Optional label to identify the section in the editor. When set and no HTML id is provided, an id is derived from this value.

eyebrowIcon:
  type: object
  comment: Optional icon displayed above the eyebrow.
  options:
    structures: _structures.eyebrowIcon
eyebrowText:
  type: text
  comment: Optional label displayed above the heading.
heading:
  type: text
  comment: Main heading for the slider section.
subtext:
  type: textarea
  comment: Supporting copy beneath the heading.
maxContentWidth:
  type: select
  comment: Maximum width constraint for the content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
paddingHorizontal:
  type: select
  comment: Horizontal padding applied to the section content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
paddingVertical:
  type: select
  comment: Vertical padding applied to the section content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
      - id: 4xl
        name: 4xl
      - id: 5xl
        name: 5xl
      - id: 6xl
        name: 6xl
colorScheme:
  type: select
  comment: Color scheme theme for the section wrapper.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
lockColorScheme:
  type: switch
  comment: Keep the selected color scheme from flipping when the visitor toggles the site theme.
  hidden: true
backgroundColor:
  type: select
  comment: Background color for the section.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: highlight-grid
        name: Highlight Grid
      - id: surface-linear-gradient
        name: Surface Linear Gradient
      - id: brand-linear-gradient-reverse
        name: Brand Linear Gradient Reverse
      - id: brand-linear-gradient
        name: Brand Linear Gradient
      - id: brand-linear-gradient-muted
        name: Brand Linear Gradient Muted
      - id: highlight-linear-gradient
        name: Highlight Linear Gradient
      - id: highlight-radial-gradient
        name: Highlight Radial Gradient
contentBackground:
  type: switch
  comment: Add a radial background in the base color behind the content.
background:
  type: object
  comment: Optional background still image or looping HTML5 video (self-hosted). Shared positioning applies to whichever type you choose. Video is hidden when the user prefers reduced motion.
  options:
    preview:
      icon: wallpaper
      text:
        - Background
      subtext:
        - key: type
background.type:
  type: select
  label: Background type
  comment: A cover image or a muted autoplay video.
  options:
    values:
      - id: image
        name: Image
      - id: video
        name: Video
background.positionVertical:
  comment: Vertical focal point (object-position for video; image position for pictures).
  type: select
  options:
    values:
      - id: top
        name: Top
      - id: center
        name: Center
      - id: bottom
        name: Bottom
background.positionHorizontal:
  comment: Horizontal focal point (object-position for video; image position for pictures).
  type: select
  options:
    values:
      - id: left
        name: Left
      - id: center
        name: Center
      - id: right
        name: Right
background.priority:
  type: switch
  label: Prioritize image load
  comment: When using a background image, load it eagerly (use for above-the-fold sections).
  hidden: "background.type !== 'image'"
background.imageSource:
  comment: URL or path to the background image.
  type: image
  hidden: "background.type !== 'image'"
  options:
    paths:
      uploads: src/assets/images
      static: ""
    resize_style: contain
    width: 1920
    height: 1280
background.imageAlt:
  comment: Alt text for the background image.
  type: textarea
  hidden: "background.type !== 'image'"
background.videoSource:
  type: file
  label: Video source
  comment: Path to a video under public/videos. Sibling formats with the same basename are added automatically when present.
  hidden: "background.type !== 'video'"
  options:
    accepts_mime_types:
      - video/mp4
      - video/webm
      - video/ogg
    paths:
      uploads: public/videos
      static: public
background.overlay:
  type: range
  comment: "Overlay in front of the background (-1.0 to 1.0). Negative values darken, positive values lighten."
  options:
    min: -1
    max: 1
    step: 0.1
verticalOffset:
  type: object
  comment: Offset section up above or below the previous section.
  options:
    empty_type: object
    preview:
      icon: arrow_upward
    structures:
      - label: Vertical Offset
        icon: arrow-upward
        value:
          size: "xl"
          direction: "front"
        _inputs:
          size:
            type: select
            comment: Size of the vertical offset.
            options:
              values:
                - id: none
                  name: None
                - id: xs
                  name: Extra Small
                - id: sm
                  name: Small
                - id: md
                  name: Medium
                - id: lg
                  name: Large
                - id: xl
                  name: Extra Large
                - id: 2xl
                  name: 2xl
                - id: 3xl
                  name: 3xl
                - id: 4xl
                  name: 4xl
                - id: 5xl
                  name: 5xl
                - id: 6xl
                  name: 6xl
                - id: nav-height
                  name: Navigation Height
          direction:
            type: select
            comment: "Direction of the offset - in front or behind the previous component. Note: this will have no effect with some components such as the navigaton bar."
            options:
              values:
                - id: front
                  name: Front
                - id: back
                  name: Back
rounded:
  type: switch
  comment: Whether to apply rounded corners to the section.
