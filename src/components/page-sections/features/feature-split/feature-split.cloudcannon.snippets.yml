featureSplit:
  template: mdx_component
  inline: false
  preview:
    text:
      - Feature Split
    subtext:
      - key: heading
    icon: view_week
    gallery:
      image: public/component-previews/page-sections/features/feature-split.svg
      fit: cover
  definitions:
    component_name: FeatureSplit
    named_args:
      - editor_key: sectionLabel
        type: string
        optional: true
        remove_empty: true
      - editor_key: maxContentWidth
        type: string
        optional: true
        remove_empty: true
      - editor_key: paddingHorizontal
        type: string
        optional: true
        remove_empty: true
      - editor_key: paddingVertical
        type: string
        optional: true
        remove_empty: true
      - editor_key: eyebrowIcon
        type: object
        optional: true
      - editor_key: eyebrowText
        type: string
        optional: true
        remove_empty: true
      - editor_key: heading
        type: string
        optional: true
        remove_empty: true
      - editor_key: subtext
        type: string
        optional: true
        remove_empty: true
      - editor_key: buttonSections
        type: array
        optional: true
      - editor_key: imageSource
        type: string
        optional: true
        remove_empty: true
      - editor_key: imageAlt
        type: string
        optional: true
        remove_empty: true
      - editor_key: imageAspectRatio
        type: string
        optional: true
        remove_empty: true
      - editor_key: imageRounded
        type: boolean
        optional: true
      - editor_key: reverse
        type: boolean
        optional: true
      - editor_key: colorScheme
        type: string
        optional: true
        remove_empty: true
      - editor_key: backgroundColor
        type: string
        optional: true
        remove_empty: true
      - editor_key: contentBackground
        type: boolean
        optional: true
      - editor_key: background
        type: object
        optional: true
        remove_empty: true
      - editor_key: verticalOffset
        type: object
        optional: true
      - editor_key: rounded
        type: boolean
        optional: true
  _inputs_from_glob:
    - /src/components/page-sections/features/feature-split/feature-split.cloudcannon.inputs.yml
