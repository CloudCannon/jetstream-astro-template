label:
  type: text
  comment: Optional label for the custom section to help identify it in the editor.
contentSections:
  type: array
  comment: Array of content sections to render within the custom section.
  options:
    structures: _structures.containerSections
maxContentWidth:
  type: select
  comment: Maximum width constraint for the content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
paddingHorizontal:
  type: select
  comment: Horizontal padding applied to the custom section content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
paddingVertical:
  type: select
  comment: Vertical padding applied to the custom section content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
colorScheme:
  type: select
  comment: Color scheme theme for the custom section.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
lockColorScheme:
  type: switch
  comment: Keep the selected color scheme from flipping when the visitor toggles the site theme.
  hidden: true
backgroundColor:
  type: select
  comment: Background color for the custom section.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
background:
  type: object
  comment: Optional background still image or looping HTML5 video (self-hosted). Shared positioning applies to whichever type you choose. Video is hidden when the user prefers reduced motion.
  options:
    empty_type: object
    structures: _structures.background
    preview:
      icon: wallpaper
      text:
        - Background
      subtext:
        - key: type
verticalOffset:
  type: object
  comment: Offset section up above or below the previous section.
  options:
    empty_type: object
    preview:
      icon: arrow_upward
    structures:
      - label: Vertical Offset
        icon: arrow-upward
        value:
          size: "xl"
          direction: "front"
        _inputs:
          size:
            type: select
            comment: Size of the vertical offset.
            options:
              values:
                - id: none
                  name: None
                - id: xs
                  name: Extra Small
                - id: sm
                  name: Small
                - id: md
                  name: Medium
                - id: lg
                  name: Large
                - id: xl
                  name: Extra Large
                - id: 2xl
                  name: 2xl
                - id: 3xl
                  name: 3xl
                - id: 4xl
                  name: 4xl
                - id: 5xl
                  name: 5xl
                - id: 6xl
                  name: 6xl
                - id: nav-height
                  name: Navigation Height
          direction:
            type: select
            comment: "Direction of the offset - in front or behind the previous component. Note: this will have no effect with some components such as the navigaton bar."
            options:
              values:
                - id: front
                  name: Front
                - id: back
                  name: Back
contentBackground:
  type: switch
  comment: Add a radial background in the base color behind the content.
rounded:
  type: switch
  comment: Whether to apply rounded corners to the custom section.
useDefaultEditableBinding:
  type: switch
  comment: Whether the custom section should use its default editable bindings.
  hidden: true
