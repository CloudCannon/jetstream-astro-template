id:
  type: text
  comment: Unique identifier for the section which can be used as an anchor link.
eyebrowIcon:
  type: object
  comment: Optional icon displayed above the eyebrow.
  options:
    structures: _structures.eyebrowIcon
eyebrowText:
  type: text
  comment: Optional label displayed above the heading.
heading:
  type: text
  comment: Headline for the CTA.
subtext:
  type: markdown
  comment: Supporting copy beneath the headline.
  options:
    blockquote: false
    bold: true
    format:
    italic: true
    link: true
    strike: false
    subscript: true
    superscript: true
    underline: false
    bulletedlist: false
    numberedlist: false
imageSource:
  type: image
  comment: Image displayed alongside the CTA content.
  options:
    paths:
      uploads: src/assets/images
      static: ""
imageAlt:
  type: text
  comment: Alt text describing the CTA image.
buttonSections:
  type: array
  comment: Buttons for calls-to-action.
  options:
    structures: _structures.buttonSections
reverse:
  type: switch
  comment: Reverse the order so buttons appear before the copy.
maxContentWidth:
  type: select
  comment: Maximum width constraint for the content.
  options:
    values:
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
paddingVertical:
  type: select
  comment: Vertical padding applied to the section content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
      - id: 4xl
        name: 4xl
colorScheme:
  type: select
  comment: Color scheme theme for the CTA.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
backgroundColor:
  type: select
  comment: Background color for the CTA.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: highlight-grid
        name: Highlight Grid
      - id: surface-linear-gradient
        name: Surface Linear Gradient
      - id: brand-linear-gradient-reverse
        name: Brand Linear Gradient Reverse
      - id: brand-linear-gradient
        name: Brand Linear Gradient
      - id: brand-linear-gradient-muted
        name: Brand Linear Gradient Muted
      - id: highlight-linear-gradient
        name: Highlight Linear Gradient
      - id: highlight-radial-gradient
        name: Highlight Radial Gradient
contentBackground:
  type: switch
  comment: Add a radial background in the base color behind the content.
background:
  type: object
  comment: Optional background still image or looping HTML5 video (self-hosted). Shared positioning applies to whichever type you choose. Video is hidden when the user prefers reduced motion.
  options:
    empty_type: object
    structures: _structures.background
    preview:
      icon: wallpaper
      text:
        - Background
      subtext:
        - key: type
verticalOffset:
  type: object
  comment: Offset section up above or below the previous section.
  options:
    empty_type: object
    preview:
      icon: arrow_upward
    structures:
      - label: Vertical Offset
        icon: arrow-upward
        value:
          size: "xl"
          direction: "front"
        _inputs:
          size:
            type: select
            comment: Size of the vertical offset.
            options:
              values:
                - id: none
                  name: None
                - id: xs
                  name: Extra Small
                - id: sm
                  name: Small
                - id: md
                  name: Medium
                - id: lg
                  name: Large
                - id: xl
                  name: Extra Large
                - id: 2xl
                  name: 2xl
                - id: 3xl
                  name: 3xl
                - id: 4xl
                  name: 4xl
                - id: 5xl
                  name: 5xl
                - id: 6xl
                  name: 6xl
                - id: nav-height
                  name: Navigation Height
          direction:
            type: select
            comment: "Direction of the offset - in front or behind the previous component. Note: this will have no effect with some components such as the navigaton bar."
            options:
              values:
                - id: front
                  name: Front
                - id: back
                  name: Back
rounded:
  type: switch
  comment: Add rounded corners to the CTA section.
