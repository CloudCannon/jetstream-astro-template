card:
  type: object
  comment: Card content for the hero.
  options:
    structures:
      values:
        - label: Card
          icon: card
          value:
            usePost: false
            post: ""
            eyebrowText: "Card Hero Eyebrow"
            heading: "Card Hero Heading"
            subtext: "Card Hero Subtext"
            metaText: "Card Hero Meta Text"
            buttonSections: []
            image: {}
            counters: []
          _inputs:
            usePost:
              type: switch
              comment: Whether to use a blog post for the card content.
            post:
              type: select
              comment: Select a blog post to use for the card content.
              hidden: "!usePost"
              options:
                values: collections.blog
            eyebrowText:
              type: text
              comment: Optional label displayed above the heading.
              hidden: "usePost"
            heading:
              type: html
              comment: Main heading text for the card section.
              hidden: "usePost"
              options:
                styles: .cloudcannon/styles/editor.css
            subtext:
              type: markdown
              comment: Optional subtext displayed beneath the heading.
              hidden: "usePost"
              options:
                bold: true
                italic: true
                link: true
                underline: true
            metaText:
              type: text
              comment: Optional emphasised line displayed beneath the subtext. Replaced by the post author and date when using a post.
              hidden: "usePost"
            buttonSections:
              type: array
              comment: Calls-to-action shown beneath the copy block.
              hidden: "usePost"
              options:
                structures: _structures.buttonSections
            image:
              type: object
              hidden: "usePost"
              options:
                structures:
                  values:
                    - label: Image
                      icon: image
                      value:
                        source: ""
                        alt: ""
                        rounded: false
                      _inputs:
                        source:
                          type: image
                          comment: The URL or path to the image.
                          options:
                            paths:
                              uploads: src/assets/images
                              static: ""
                        alt:
                          type: textarea
                          comment: Alternative text for accessibility.
                        rounded:
                          type: switch
                          comment: Whether to apply rounded corners to the image.
            counters:
              hidden: "usePost"
              options:
                structures:
                  values:
                    - label: Counter
                      icon:
                      value:
                        counter: {}
                        subtext: "Counter Subtext"
                      _inputs:
                        counter:
                          options:
                            structures:
                              values:
                                - label: Counter
                                  icon: speed
                                  value:
                                    number: 100
                                    prefix: $
                                    suffix: M
                                  _inputs:
                                    number:
                                      type: number
                                      comment: The number to count to.
                                    prefix:
                                      comment: Text immediately before the number.
                                    suffix:
                                      comment: Text immediately after the number.
                        subtext:
                          type: markdown
                          comment: Optional subtext displayed beneath the counter.
                          options:
                            bold: true
                            italic: true
                            link: true
                            underline: true
id:
  type: text
  comment: Unique identifier for the section which can be used as an anchor link.
eyebrowIcon:
  type: object
  comment: Optional icon displayed above the eyebrow.
  options:
    structures: _structures.eyebrowIcon
heading:
  type: html
  comment: Main heading text for the section.
  options:
    styles: .cloudcannon/styles/editor.css
subtext:
  type: markdown
  comment: Optional subtext displayed next to the heading.
  options:
    bold: true
    italic: true
    link: true
    underline: true
maxContentWidth:
  type: select
  comment: Maximum width constraint for the content.
  options:
    values:
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
paddingVertical:
  type: select
  comment: Vertical padding applied to the custom section content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
colorScheme:
  type: select
  comment: Color scheme theme for the hero.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
backgroundColor:
  type: select
  comment: Background color for the section.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: highlight-grid
        name: Highlight Grid
      - id: surface-linear-gradient
        name: Surface Linear Gradient
      - id: brand-linear-gradient-reverse
        name: Brand Linear Gradient Reverse
      - id: brand-linear-gradient
        name: Brand Linear Gradient
      - id: brand-linear-gradient-muted
        name: Brand Linear Gradient Muted
      - id: highlight-linear-gradient
        name: Highlight Linear Gradient
      - id: highlight-radial-gradient
        name: Highlight Radial Gradient
verticalOffset:
  type: object
  comment: Offset section up above or below the previous section.
  options:
    empty_type: object
    preview:
      icon: arrow_upward
    structures:
      - label: Vertical Offset
        icon: arrow-upward
        value:
          size: "xl"
          direction: "front"
        _inputs:
          size:
            type: select
            comment: Size of the vertical offset.
            options:
              values:
                - id: none
                  name: None
                - id: xs
                  name: Extra Small
                - id: sm
                  name: Small
                - id: md
                  name: Medium
                - id: lg
                  name: Large
                - id: xl
                  name: Extra Large
                - id: 2xl
                  name: 2xl
                - id: 3xl
                  name: 3xl
                - id: 4xl
                  name: 4xl
                - id: 5xl
                  name: 5xl
                - id: 6xl
                  name: 6xl
                - id: nav-height
                  name: Navigation Height
          direction:
            type: select
            comment: "Direction of the offset - in front or behind the previous component. Note: this will have no effect with some components such as the navigaton bar."
            options:
              values:
                - id: front
                  name: Front
                - id: back
                  name: Back
rounded:
  type: switch
  comment: Whether to apply rounded corners to the section.
