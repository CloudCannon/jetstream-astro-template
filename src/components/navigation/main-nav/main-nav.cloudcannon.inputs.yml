logoSource:
  type: image
  comment: "Logo image source URL or path. Leave empty to hide the logo."
  options:
    resize_style: contain
    width: 1920
    height: 1280
logoAlternateSource:
  type: image
  comment: "Optional alternate logo shown when the site theme is toggled. The main logo is shown by default."
  options:
    resize_style: contain
    width: 1920
    height: 1280
logoAlt:
  type: text
  comment: "Alt text for the logo image for accessibility."
navData:
  type: array
  comment: "Array of navigation items to render in the navigation bar."
  options:
    structures: _structures.navItemLevel1
buttonSections:
  type: array
  comment: "Array of button components to display in the navigation bar. See the Button component documentation for more information."
_structures:
  navItemLevel1:
    values:
      - label: Navigation Item (Level 1)
        icon: link
        value:
          name: ""
          path: ""
          children: []
        _inputs:
          name:
            type: text
            comment: "Display text for the navigation item."
          path:
            type: url
            comment: "URL path for the navigation item."
            options:
              hide_link_to_file: true
              hide_link_to_email_address: true
              hide_link_to_telephone: true
          children:
            type: array
            comment: "Child navigation items for dropdown menus."
            options:
              structures: _structures.navItemLevel2
  navItemLevel2:
    values:
      - label: Navigation Item (Level 2)
        icon: link
        value:
          name: ""
          path: ""
          subtext: ""
          iconName: ""
          iconPosition: before
          children: []
        _inputs:
          name:
            type: text
            comment: "Display text for the child navigation item."
          path:
            type: url
            comment: "URL path for the child navigation item."
            options:
              hide_link_to_file: true
              hide_link_to_email_address: true
              hide_link_to_telephone: true
          subtext:
            type: text
            comment: "Optional description shown beneath the name in the dropdown."
          iconName:
            type: select
            comment: "Optional icon shown alongside the name. Sourced from [Heroicons](https://heroicons.com/)."
            options:
              values: _select_data.icons
              preview:
                text:
                  - key: name
                image:
                  - template: src/icons/{id}.svg
          iconPosition:
            type: select
            comment: "Whether the icon sits before or after the name."
            hidden: "!iconName"
            options:
              values:
                - id: before
                  name: Before
                - id: after
                  name: After
          children:
            type: array
            comment: "Grandchild navigation items for nested dropdowns."
            options:
              structures: _structures.navItemLevel3
  navItemLevel3:
    values:
      - label: Navigation Item (Level 3)
        icon: link
        value:
          name: ""
          path: ""
          subtext: ""
          iconName: ""
          iconPosition: before
        _inputs:
          name:
            type: text
            comment: "Display text for the grandchild navigation item."
          path:
            type: url
            comment: "URL path for the grandchild navigation item."
            options:
              hide_link_to_file: true
              hide_link_to_email_address: true
              hide_link_to_telephone: true
          subtext:
            type: text
            comment: "Optional description shown beneath the name in the dropdown."
          iconName:
            type: select
            comment: "Optional icon shown alongside the name. Sourced from [Heroicons](https://heroicons.com/)."
            options:
              values: _select_data.icons
              preview:
                text:
                  - key: name
                image:
                  - template: src/icons/{id}.svg
          iconPosition:
            type: select
            comment: "Whether the icon sits before or after the name."
            hidden: "!iconName"
            options:
              values:
                - id: before
                  name: Before
                - id: after
                  name: After
