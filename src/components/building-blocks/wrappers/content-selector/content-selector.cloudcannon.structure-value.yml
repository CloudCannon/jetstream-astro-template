label: Content Selector
icon: view_sidebar
description: Lets users switch between different content panels using tabs.
value:
  _component: building-blocks/wrappers/content-selector
  _uuid:
  label: ""
  items: []
  navigationPosition: start
preview:
  text:
    - Content Selector
  subtext:
    - key: label
  icon: view_sidebar
picker_preview:
  text: Content Selector
  subtext: Lets users switch between different content panels using tabs.
_inputs_from_glob:
  - /src/components/building-blocks/wrappers/content-selector/content-selector.cloudcannon.inputs.yml
_structures:
  contentSelectorItems:
    # Same shape as the Tab structure in tabbed-content: the item is a component,
    # so it needs a key CloudCannon can identify it by and a `_uuid` for its
    # translation namespace.
    id_key: _component
    values:
      - label: Content Selector Item
        icon: place_item
        value:
          _component: building-blocks/wrappers/content-selector/content-selector-item
          _uuid:
          title: Section Title
          contentSections: []
        preview:
          text:
            - key: title
            - Content Selector Item
          subtext:
            - template: A content selector item containing {contentSections|array_length} content {"block"|pluralize=contentSections}
            - Add content to the content selector item
        _inputs:
          title:
            type: text
            comment: The heading for the content panel.
          subtext:
            type: text
            comment: Optional supporting text shown beneath the item heading.
          iconName:
            comment: The name of the icon to display. Sourced from [Heroicons](https://heroicons.com/).
            type: select
            options:
              values: _select_data.icons
          iconColor:
            type: select
            comment: The color of the icon.
            hidden: "!iconName"
            options:
              values:
                - id: default
                  name: Default
                - id: blue
                  name: Blue
                - id: green
                  name: Green
                - id: yellow
                  name: Yellow
                - id: orange
                  name: Orange
                - id: red
                  name: Red
                - id: purple
                  name: Purple
                - id: pink
                  name: Pink
                - id: cyan
                  name: Cyan
          contentSections:
            type: array
            options:
              structures: _structures.contentSelectorSections
