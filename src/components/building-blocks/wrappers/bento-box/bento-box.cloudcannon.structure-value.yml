label: Bento Box
icon: grid_on
description: Arranges content into a grid that adapts to screen size, with items of varying widths.
value:
  _component: building-blocks/wrappers/bento-box
  label: ""
  items: []
  gap: md
preview:
  text:
    - Bento Box
  subtext:
    - key: label
  icon: grid_on
  gallery:
    image: public/component-previews/building-blocks/wrappers/bento-box.svg
    fit: cover
picker_preview:
  text: Bento Box
  subtext: Arranges content into a grid that adapts to screen size, with items of varying widths.
  gallery:
    image: public/component-previews/building-blocks/wrappers/bento-box.svg
    fit: cover
_inputs_from_glob:
  - /src/components/building-blocks/wrappers/bento-box/bento-box.cloudcannon.inputs.yml
_structures:
  bentoBoxItems:
    values:
      - label: Grid Item
        value:
          _component: building-blocks/wrappers/bento-box/bento-box-item
          contentSections: []
          columnSpan: 4
          rowSpan: 1
        preview:
          icon: grid_view
          text: Grid Item
          subtext:
            - template: Contains {contentSections|array_length} content {"block"|pluralize=contentSections}
            - Add one or more content blocks to the grid item
        _inputs:
          contentSections:
            type: array
            comment: Content sections to render within this grid item.
            options:
              structures: _structures.gridItemSections
          columnSpan:
            type: range
            comment: The number of columns the item should span, each row has 12 columns.
            options:
              min: 1
              max: 12
              step: 1
              default: 4
          rowSpan:
            type: range
            comment: The number of rows the item should span.
            options:
              min: 1
              max: 4
              step: 1
              default: 1
