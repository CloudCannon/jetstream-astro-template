label:
  comment: Optional label for the grid to help identify it in the editor.
  type: text
items:
  label: Grid Items
  comment: Array of grid items, each containing content blocks to render.
  type: array
  options:
    structures: _structures.bentoBoxItems
gap:
  comment: The gap between grid items.
  type: select
  options:
    values:
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
