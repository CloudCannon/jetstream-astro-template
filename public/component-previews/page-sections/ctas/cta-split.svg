        --pv-surface: #232320;
        --pv-line: #2E2D29;
        --pv-glyph: #45443E;
        --pv-body: #3A3934;
        --pv-subject: #6E6A62;
        --pv-ink: #F5F3EE;
        --pv-on-ink: #6B6B6B;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 160)">
    <rect x="80" y="40" width="460" height="40" rx="20" fill="var(--pv-subject, #A8A398)"/>
    <rect x="80" y="96" width="340" height="40" rx="20" fill="var(--pv-subject, #A8A398)"/>
    <rect x="80" y="176" width="520" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="80" y="200" width="470" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="80" y="224" width="400" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="80" y="300" width="220" height="74" rx="10" fill="var(--pv-ink, #151515)"/>
    <rect x="135" y="331" width="110" height="12" rx="6" fill="var(--pv-on-ink, #9A9A9A)"/>
    <rect x="330" y="300" width="190" height="74" rx="10" fill="var(--pv-paper, #FFFFFF)" stroke="var(--pv-glyph, #CFCBC2)" stroke-width="2"/>
