    <rect x="680" y="0" width="520" height="400" rx="10" fill="var(--pv-surface, #EBE9E3)"/>
    <circle cx="1044" cy="128" r="24" fill="var(--pv-glyph, #CFCBC2)"/>
    <polygon points="797,303 897,213 973,303" fill="var(--pv-glyph, #CFCBC2)" stroke="var(--pv-glyph, #CFCBC2)" stroke-width="18" stroke-linejoin="round"/>
    <polygon points="934,305 1023,233 1108,305" fill="var(--pv-glyph, #CFCBC2)" stroke="var(--pv-glyph, #CFCBC2)" stroke-width="14" stroke-linejoin="round"/>
