<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t-cta-form">
  <title id="t-cta-form">CTA form component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #151515;
        --pv-panel: #1D1D1B;
        --pv-surface: #232320;
        --pv-line: #2E2D29;
        --pv-glyph: #45443E;
        --pv-body: #3A3934;
        --pv-subject: #6E6A62;
        --pv-ink: #F5F3EE;
        --pv-on-ink: #6B6B6B;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 129)">
    <rect x="80" y="30" width="470" height="40" rx="20" fill="var(--pv-subject, #A8A398)"/>
    <rect x="80" y="86" width="330" height="40" rx="20" fill="var(--pv-subject, #A8A398)"/>
    <rect x="80" y="166" width="520" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="80" y="190" width="480" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="80" y="214" width="390" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="680" y="0" width="150" height="16" rx="8" fill="var(--pv-subject, #A8A398)"/>
    <rect x="680" y="30" width="520" height="66" rx="10" fill="var(--pv-paper, #FFFFFF)" stroke="var(--pv-glyph, #CFCBC2)" stroke-width="3"/>
    <rect x="680" y="110" width="150" height="16" rx="8" fill="var(--pv-subject, #A8A398)"/>
    <rect x="680" y="140" width="520" height="66" rx="10" fill="var(--pv-paper, #FFFFFF)" stroke="var(--pv-glyph, #CFCBC2)" stroke-width="3"/>
    <rect x="680" y="220" width="150" height="16" rx="8" fill="var(--pv-subject, #A8A398)"/>
    <rect x="680" y="250" width="520" height="120" rx="10" fill="var(--pv-paper, #FFFFFF)" stroke="var(--pv-glyph, #CFCBC2)" stroke-width="3"/>
    <rect x="680" y="392" width="520" height="70" rx="10" fill="var(--pv-ink, #151515)"/>
    <rect x="875" y="421" width="130" height="12" rx="6" fill="var(--pv-on-ink, #9A9A9A)"/>
  </g>
