    <rect x="680" y="70" width="120" height="120" rx="10" fill="var(--pv-surface, #EBE9E3)"/>
    <rect x="880" y="70" width="120" height="120" rx="10" fill="var(--pv-surface, #EBE9E3)"/>
    <rect x="1080" y="70" width="120" height="120" rx="10" fill="var(--pv-surface, #EBE9E3)"/>
