<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t-custom-section">
  <title id="t-custom-section">Custom section component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #151515;
        --pv-panel: #1D1D1B;
        --pv-surface: #232320;
        --pv-line: #2E2D29;
        --pv-glyph: #45443E;
        --pv-body: #3A3934;
        --pv-subject: #6E6A62;
        --pv-ink: #F5F3EE;
        --pv-on-ink: #6B6B6B;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 100)">
    <rect x="80" y="0" width="1120" height="520" fill="var(--pv-panel, #F7F6F3)"/>
    <rect x="410" y="70" width="460" height="40" rx="20" fill="var(--pv-subject, #A8A398)"/>
    <rect x="270" y="144" width="740" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="320" y="168" width="640" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="150" y="250" width="980" height="200" rx="10" fill="var(--pv-surface, #EBE9E3)"/>
    <circle cx="836" cy="314" r="12" fill="var(--pv-glyph, #CFCBC2)"/>
    <polygon points="360,402 561,354 712,402" fill="var(--pv-glyph, #CFCBC2)" stroke="var(--pv-glyph, #CFCBC2)" stroke-width="8" stroke-linejoin="round"/>
    <polygon points="629,402 797,366 957,402" fill="var(--pv-glyph, #CFCBC2)" stroke="var(--pv-glyph, #CFCBC2)" stroke-width="8" stroke-linejoin="round"/>
  </g>
</svg>
