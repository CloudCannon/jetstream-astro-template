<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t-select">
  <title id="t-select">Select component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #151515;
        --pv-panel: #1D1D1B;
        --pv-surface: #232320;
        --pv-line: #2E2D29;
        --pv-glyph: #45443E;
        --pv-body: #3A3934;
        --pv-subject: #6E6A62;
        --pv-ink: #F5F3EE;
        --pv-on-ink: #6B6B6B;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 305)">
    <rect x="360" y="0" width="180" height="16" rx="8" fill="var(--pv-subject, #A8A398)"/>
    <rect x="360" y="34" width="560" height="76" rx="10" fill="var(--pv-paper, #FFFFFF)" stroke="var(--pv-glyph, #CFCBC2)" stroke-width="3"/>
    <rect x="384" y="66" width="190" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <polygon points="871,69 885,69 878,77" fill="var(--pv-subject, #A8A398)" stroke="var(--pv-subject, #A8A398)" stroke-width="6" stroke-linejoin="round"/>
  </g>
</svg>
