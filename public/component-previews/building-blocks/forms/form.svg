<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t-form">
  <title id="t-form">Form component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #151515;
        --pv-panel: #1D1D1B;
        --pv-surface: #232320;
        --pv-line: #2E2D29;
        --pv-glyph: #45443E;
        --pv-body: #3A3934;
        --pv-subject: #6E6A62;
        --pv-ink: #F5F3EE;
        --pv-on-ink: #6B6B6B;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 114)">
    <rect x="360" y="0" width="170" height="16" rx="8" fill="var(--pv-subject, #A8A398)"/>
    <rect x="360" y="30" width="560" height="70" rx="10" fill="var(--pv-paper, #FFFFFF)" stroke="var(--pv-glyph, #CFCBC2)" stroke-width="3"/>
    <rect x="360" y="116" width="170" height="16" rx="8" fill="var(--pv-subject, #A8A398)"/>
    <rect x="360" y="146" width="560" height="70" rx="10" fill="var(--pv-paper, #FFFFFF)" stroke="var(--pv-glyph, #CFCBC2)" stroke-width="3"/>
    <rect x="360" y="232" width="170" height="16" rx="8" fill="var(--pv-subject, #A8A398)"/>
    <rect x="360" y="262" width="560" height="130" rx="10" fill="var(--pv-paper, #FFFFFF)" stroke="var(--pv-glyph, #CFCBC2)" stroke-width="3"/>
    <rect x="360" y="418" width="220" height="74" rx="10" fill="var(--pv-ink, #151515)"/>
    <rect x="415" y="449" width="110" height="12" rx="6" fill="var(--pv-on-ink, #9A9A9A)"/>
  </g>
</svg>
