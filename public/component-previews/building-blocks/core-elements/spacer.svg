<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t-spacer">
  <title id="t-spacer">Spacer component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #151515;
        --pv-panel: #1D1D1B;
        --pv-surface: #232320;
        --pv-line: #2E2D29;
        --pv-glyph: #45443E;
        --pv-body: #3A3934;
        --pv-subject: #6E6A62;
        --pv-ink: #F5F3EE;
        --pv-on-ink: #6B6B6B;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 204)">
    <rect x="360" y="0" width="560" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="360" y="24" width="480" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="360" y="100" width="560" height="5" rx="1" fill="var(--pv-subject, #A8A398)"/>
    <rect x="637" y="105" width="6" height="127" rx="3" fill="var(--pv-subject, #A8A398)"/>
    <rect x="360" y="232" width="560" height="5" rx="1" fill="var(--pv-subject, #A8A398)"/>
    <rect x="360" y="276" width="560" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="360" y="300" width="430" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
  </g>
</svg>
