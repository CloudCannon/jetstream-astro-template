<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t-divider">
  <title id="t-divider">Divider component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #151515;
        --pv-panel: #1D1D1B;
        --pv-surface: #232320;
        --pv-line: #2E2D29;
        --pv-glyph: #45443E;
        --pv-body: #3A3934;
        --pv-subject: #6E6A62;
        --pv-ink: #F5F3EE;
        --pv-on-ink: #6B6B6B;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 264)">
    <rect x="360" y="0" width="560" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="360" y="24" width="470" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="360" y="48" width="520" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="360" y="112" width="560" height="6" rx="1" fill="var(--pv-subject, #A8A398)"/>
    <rect x="360" y="156" width="560" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="360" y="180" width="500" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
  </g>
</svg>
