<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t-modal">
  <title id="t-modal">Modal component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #151515;
        --pv-panel: #1D1D1B;
        --pv-surface: #232320;
        --pv-line: #2E2D29;
        --pv-glyph: #45443E;
        --pv-body: #3A3934;
        --pv-subject: #6E6A62;
        --pv-ink: #F5F3EE;
        --pv-on-ink: #6B6B6B;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 80)">
    <rect x="80" y="0" width="1120" height="560" fill="var(--pv-panel, #F7F6F3)"/>
    <rect x="330" y="90" width="620" height="380" rx="10" fill="var(--pv-paper, #FFFFFF)" stroke="var(--pv-line, #E4E1DA)" stroke-width="2"/>
    <rect x="370" y="140" width="340" height="26" rx="13" fill="var(--pv-subject, #A8A398)"/>
    <rect x="874" y="138" width="36" height="36" rx="18" fill="var(--pv-glyph, #CFCBC2)"/>
    <rect x="370" y="208" width="540" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="370" y="232" width="500" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="370" y="256" width="420" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="370" y="380" width="190" height="66" rx="10" fill="var(--pv-ink, #151515)"/>
    <rect x="417" y="407" width="96" height="12" rx="6" fill="var(--pv-on-ink, #9A9A9A)"/>
    <rect x="580" y="380" width="170" height="66" rx="10" fill="var(--pv-paper, #FFFFFF)" stroke="var(--pv-glyph, #CFCBC2)" stroke-width="2"/>
    <rect x="625" y="407" width="80" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
  </g>
</svg>
