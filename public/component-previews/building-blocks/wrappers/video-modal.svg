<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t-video-modal">
  <title id="t-video-modal">Video modal component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #151515;
        --pv-panel: #1D1D1B;
        --pv-surface: #232320;
        --pv-line: #2E2D29;
        --pv-glyph: #45443E;
        --pv-body: #3A3934;
        --pv-subject: #6E6A62;
        --pv-ink: #F5F3EE;
        --pv-on-ink: #6B6B6B;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 60)">
    <rect x="80" y="0" width="1120" height="600" fill="var(--pv-panel, #F7F6F3)"/>
    <rect x="280" y="80" width="720" height="440" rx="10" fill="var(--pv-paper, #FFFFFF)" stroke="var(--pv-line, #E4E1DA)" stroke-width="2"/>
    <rect x="308" y="108" width="664" height="384" rx="10" fill="var(--pv-surface, #EBE9E3)"/>
    <circle cx="640" cy="300" r="62" fill="var(--pv-subject, #A8A398)"/>
    <polygon points="627,279 627,321 663,300" fill="var(--pv-paper, #FFFFFF)" stroke="var(--pv-paper, #FFFFFF)" stroke-width="14" stroke-linejoin="round"/>
    <rect x="934" y="96" width="36" height="36" rx="18" fill="var(--pv-glyph, #CFCBC2)"/>
  </g>
</svg>
