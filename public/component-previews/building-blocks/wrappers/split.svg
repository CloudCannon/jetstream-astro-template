<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t-split">
  <title id="t-split">Split component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #151515;
        --pv-panel: #1D1D1B;
        --pv-surface: #232320;
        --pv-line: #2E2D29;
        --pv-glyph: #45443E;
        --pv-body: #3A3934;
        --pv-subject: #6E6A62;
        --pv-ink: #F5F3EE;
        --pv-on-ink: #6B6B6B;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 150)">
    <rect x="160" y="40" width="380" height="40" rx="20" fill="var(--pv-subject, #A8A398)"/>
    <rect x="160" y="130" width="450" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="160" y="154" width="400" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="160" y="178" width="430" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="160" y="202" width="300" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="160" y="300" width="200" height="68" rx="10" fill="var(--pv-ink, #151515)"/>
    <rect x="210" y="328" width="100" height="12" rx="6" fill="var(--pv-on-ink, #9A9A9A)"/>
    <rect x="670" y="0" width="450" height="420" rx="10" fill="var(--pv-surface, #EBE9E3)"/>
    <circle cx="985" cy="134" r="25" fill="var(--pv-glyph, #CFCBC2)"/>
    <polygon points="771,319 858,224 923,319" fill="var(--pv-glyph, #CFCBC2)" stroke="var(--pv-glyph, #CFCBC2)" stroke-width="18" stroke-linejoin="round"/>
    <polygon points="890,321 967,245 1040,321" fill="var(--pv-glyph, #CFCBC2)" stroke="var(--pv-glyph, #CFCBC2)" stroke-width="14" stroke-linejoin="round"/>
  </g>
</svg>
