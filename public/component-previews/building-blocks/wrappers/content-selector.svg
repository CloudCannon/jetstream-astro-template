<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t-content-selector">
  <title id="t-content-selector">Content selector component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #151515;
        --pv-panel: #1D1D1B;
        --pv-surface: #232320;
        --pv-line: #2E2D29;
        --pv-glyph: #45443E;
        --pv-body: #3A3934;
        --pv-subject: #6E6A62;
        --pv-ink: #F5F3EE;
        --pv-on-ink: #6B6B6B;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 155)">
    <rect x="160" y="0" width="200" height="64" rx="10" fill="var(--pv-ink, #151515)"/>
    <rect x="205" y="26" width="110" height="12" rx="6" fill="var(--pv-on-ink, #9A9A9A)"/>
    <rect x="429" y="26" width="110" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="653" y="26" width="110" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="160" y="72" width="960" height="2" rx="1" fill="var(--pv-line, #E4E1DA)"/>
    <rect x="160" y="110" width="420" height="300" rx="10" fill="var(--pv-surface, #EBE9E3)"/>
    <circle cx="454" cy="206" r="18" fill="var(--pv-glyph, #CFCBC2)"/>
    <polygon points="255,337 336,270 396,337" fill="var(--pv-glyph, #CFCBC2)" stroke="var(--pv-glyph, #CFCBC2)" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="364,339 437,284 507,339" fill="var(--pv-glyph, #CFCBC2)" stroke="var(--pv-glyph, #CFCBC2)" stroke-width="10" stroke-linejoin="round"/>
    <rect x="630" y="130" width="340" height="26" rx="13" fill="var(--pv-subject, #A8A398)"/>
    <rect x="630" y="186" width="490" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="630" y="210" width="440" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="630" y="234" width="470" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="630" y="258" width="330" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
  </g>
</svg>
