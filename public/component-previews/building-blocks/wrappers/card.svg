<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t-card">
  <title id="t-card">Card component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #151515;
        --pv-panel: #1D1D1B;
        --pv-surface: #232320;
        --pv-line: #2E2D29;
        --pv-glyph: #45443E;
        --pv-body: #3A3934;
        --pv-subject: #6E6A62;
        --pv-ink: #F5F3EE;
        --pv-on-ink: #6B6B6B;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 80)">
    <rect x="260" y="0" width="760" height="560" rx="10" fill="var(--pv-paper, #FFFFFF)" stroke="var(--pv-line, #E4E1DA)" stroke-width="2"/>
    <rect x="300" y="40" width="680" height="240" rx="10" fill="var(--pv-surface, #EBE9E3)"/>
    <circle cx="776" cy="117" r="14" fill="var(--pv-glyph, #CFCBC2)"/>
    <polygon points="448,222 585,166 689,222" fill="var(--pv-glyph, #CFCBC2)" stroke="var(--pv-glyph, #CFCBC2)" stroke-width="10" stroke-linejoin="round"/>
    <polygon points="628,223 749,179 863,223" fill="var(--pv-glyph, #CFCBC2)" stroke="var(--pv-glyph, #CFCBC2)" stroke-width="8" stroke-linejoin="round"/>
    <rect x="300" y="314" width="360" height="26" rx="13" fill="var(--pv-subject, #A8A398)"/>
    <rect x="300" y="364" width="680" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="300" y="388" width="620" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="300" y="412" width="500" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="300" y="440" width="200" height="68" rx="10" fill="var(--pv-ink, #151515)"/>
    <rect x="350" y="468" width="100" height="12" rx="6" fill="var(--pv-on-ink, #9A9A9A)"/>
  </g>
</svg>
