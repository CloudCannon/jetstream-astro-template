<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t-bar">
  <title id="t-bar">Navigation bar component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #151515;
        --pv-panel: #1D1D1B;
        --pv-surface: #232320;
        --pv-line: #2E2D29;
        --pv-glyph: #45443E;
        --pv-body: #3A3934;
        --pv-subject: #6E6A62;
        --pv-ink: #F5F3EE;
        --pv-on-ink: #6B6B6B;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 312)">
    <rect x="80" y="0" width="1120" height="96" fill="var(--pv-panel, #F7F6F3)"/>
    <rect x="116" y="24" width="48" height="48" rx="10" fill="var(--pv-surface, #EBE9E3)"/>
    <rect x="180" y="40" width="130" height="16" rx="8" fill="var(--pv-subject, #A8A398)"/>
    <rect x="450" y="40" width="100" height="16" rx="8" fill="var(--pv-subject, #A8A398)"/>
    <rect x="590" y="40" width="100" height="16" rx="8" fill="var(--pv-subject, #A8A398)"/>
    <rect x="730" y="40" width="100" height="16" rx="8" fill="var(--pv-subject, #A8A398)"/>
    <rect x="1000" y="18" width="164" height="60" rx="10" fill="var(--pv-ink, #151515)"/>
    <rect x="1040" y="42" width="84" height="12" rx="6" fill="var(--pv-on-ink, #9A9A9A)"/>
  </g>
</svg>
